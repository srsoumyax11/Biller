name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          target: default
          arch: x86_64
          cache: true

      - name: Create .env file from example
        run: cp .env.example .env

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Djava.awt.headless=true"
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: app/build/outputs/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create .env file from example
        run: cp .env.example .env

      - name: Run unit tests
        run: gradle test --stacktrace -Dorg.gradle.jvmargs="-Djava.awt.headless=true"
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 30
